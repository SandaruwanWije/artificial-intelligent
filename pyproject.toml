[project]
name = "artificial-intelligent"
version = "0.1.0"
description = "A small neural network library in plain Python, built one idea at a time"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
arrays = [
    "numpy>=2.5.5",
]
dev = [
    "pytest",
]
libraries = [
    "keras>=3.15.1",
    "torch>=2.15.0",
]

[tool.uv]
package = false
default-groups = ["dev", "arrays", "libraries"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib -v"
# Keras warns, once for every step, about how it hands its numbers to NumPy.
filterwarnings = ["ignore::DeprecationWarning:keras.*"]
