[project]
name = "artificial-intelligent"
version = "0.1.0"
description = "Companion code for the AI articles on byteblueprints.com"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Run from the repo root, so every project imports as a package: ai_01_perceptron.gates
pythonpath = ["."]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
norecursedirs = [".venv", ".git", "images"]
